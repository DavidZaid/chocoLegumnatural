<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chocolegum Natural - Experiencia 3D & RA</title>
  
  <!-- Librería A-Frame 3D -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- Fuente Premium Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0d0d0d;
    }

    /* Tarjeta Flotante Interactiva de Marketing */
    #info-card {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 540px;
      background: rgba(15, 12, 10, 0.85);
      border: 1px solid rgba(224, 186, 126, 0.35);
      color: #f7f4ef;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      z-index: 999;
      backdrop-filter: blur(20px);
      transition: all 0.4s ease;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #e0ba7e;
      font-weight: 700;
      margin-bottom: 6px;
    }
    #card-title {
      margin: 0 0 8px 0;
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 700;
    }
    #card-text {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #d1c7bd;
      font-weight: 300;
    }

    /* Galería de Imágenes HD */
    .image-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }
    .image-card {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      height: 75px;
      border: 1px solid rgba(224, 186, 126, 0.3);
      cursor: pointer;
    }
    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .image-card:hover img {
      transform: scale(1.1);
    }
    .image-card span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 0.65rem;
      padding: 3px 4px;
      text-align: center;
      font-weight: 600;
    }

    /* Indicador de Instrucción */
    .instruction-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(224, 186, 126, 0.18);
      border: 1px solid rgba(224, 186, 126, 0.5);
      color: #e0ba7e;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 999;
      pointer-events: none;
      backdrop-filter: blur(12px);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Card Interactivo Principal -->
  <div id="info-card">
    <span class="badge" id="card-badge">CHOCOLEGUM NATURAL</span>
    <h2 id="card-title">Chocolatería Artesanal & Legumbres</h2>
    <p id="card-text">Toca o selecciona cualquiera de los 4 pedestales en 3D para explorar nuestra Misión, Visión 2030, Selección de Ingredientes Gourmet y el Respaldo SENA.</p>
    <div id="gallery-container"></div>
  </div>

  <div class="instruction-bar">
    ✨ Toca cualquier pedestal 3D para explorar ✨
  </div>

  <!-- Escena A-Frame 3D -->
  <a-scene embedded vr-mode-ui="enabled: true">
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#e0ba7e" intensity="0.9" position="-2 4 2"></a-light>
    <a-light type="point" color="#8c4327" intensity="0.6" position="0 2 -2"></a-light>

    <!-- Cámara y Cursor -->
    <a-entity camera look-controls raycaster="objects: .clickable" position="0 1.5 0">
      <a-cursor color="#e0ba7e" fuse="false" raycaster="objects: .clickable"></a-cursor>
    </a-entity>

    <!-- Entorno Escénico -->
    <a-plane position="0 0 -4" rotation="-90 0 0" width="12" height="12" color="#0a0807"></a-plane>
    <a-ring position="0 0.01 -4" rotation="-90 0 0" radius-inner="2.3" radius-outer="2.33" color="#e0ba7e" opacity="0.4"></a-ring>

    <!-- Título Principal 3D -->
    <a-text value="CHOCOLEGUM NATURAL" position="-1.8 3.3 -4" color="#FFFFFF" width="7"></a-text>
    <a-text value="Tocancipa | Chocolateria Gourmet & Snacks de Legumbres" position="-2.1 2.9 -4" color="#e0ba7e" width="4.3"></a-text>

    <!-- ==================== PEDESTAL 1: MISIÓN ==================== -->
    <a-entity position="-2.2 0 -4">
      <a-box class="clickable" onclick="showSection('mision')" position="0 0.5 0" depth="0.8" height="1" width="0.8" color="#1a120c"
             animation="property: position; to: 0 0.55 0; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine">
        <a-image src="https://images.unsplash.com/photo-1548907040-4baa42d10919?auto=format&fit=crop&w=600&q=80" 
                 position="0 0.8 0.41" width="0.72" height="0.52"></a-image>
      </a-box>
      <a-text value="1. MISIÓN" position="-0.5 1.3 0" color="#e0ba7e" width="3.5"></a-text>
    </a-entity>

    <!-- ==================== PEDESTAL 2: VISIÓN ==================== -->
    <a-entity position="-0.7 0 -3.3">
      <a-box class="clickable" onclick="showSection('vision')" position="0 0.5 0" depth="0.8" height="1" width="0.8" color="#1a120c"
             animation="property: position; to: 0 0.55 0; dir: alternate; loop: true; dur: 3400; easing: easeInOutSine">
        <a-image src="https://images.unsplash.com/photo-1511381939415-e44015466834?auto=format&fit=crop&w=600&q=80" 
                 position="0 0.8 0.41" width="0.72" height="0.52"></a-image>
      </a-box>
      <a-text value="2. VISIÓN 2030" position="-0.7 1.3 0" color="#e0ba7e" width="3.5"></a-text>
    </a-entity>

    <!-- ==================== PEDESTAL 3: INGREDIENTES ==================== -->
    <a-entity position="0.7 0 -3.3">
      <a-box class="clickable" onclick="showSection('ingredientes')" position="0 0.5 0" depth="0.8" height="1" width="0.8" color="#1a120c"
             animation="property: position; to: 0 0.55 0; dir: alternate; loop: true; dur: 3200; easing: easeInOutSine">
        <a-image src="https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=600&q=80" 
                 position="0 0.8 0.41" width="0.72" height="0.52"></a-image>
      </a-box>
      <a-text value="3. INGREDIENTES" position="-0.8 1.3 0" color="#e0ba7e" width="3.5"></a-text>
    </a-entity>

    <!-- ==================== PEDESTAL 4: ALIANZA SENA ==================== -->
    <a-entity position="2.2 0 -4">
      <a-box class="clickable" onclick="showSection('sena')" position="0 0.5 0" depth="0.8" height="1" width="0.8" color="#1a120c"
             animation="property: position; to: 0 0.55 0; dir: alternate; loop: true; dur: 3800; easing: easeInOutSine">
        <a-image src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=600&q=80" 
                 position="0 0.8 0.41" width="0.72" height="0.52"></a-image>
      </a-box>
      <a-text value="4. SENA" position="-0.4 1.3 0" color="#e0ba7e" width="3.5"></a-text>
    </a-entity>
  </a-scene>

  <!-- Lógica Interactiva y Datos de Marketing -->
  <script>
    const contentData = {
      mision: {
        badge: "PROPÓSITO DE MARCA",
        title: "🎯 Nuestra Misión",
        text: "Chocolegum Natural elabora y ofrece chocolates artesanales y snacks innovadores a base de harina de garbanzo y lentejas. Brindamos una experiencia diferente de sabor combinando creatividad, nutrición y elaboración artesanal con ingredientes de alta calidad.",
        gallery: [
          { name: "Chocolate Artesanal", url: "https://images.unsplash.com/photo-1548907040-4baa42d10919?auto=format&fit=crop&w=400&q=80" },
          { name: "Snack Nutritivo", url: "https://images.unsplash.com/photo-1582176604856-e822b3174241?auto=format&fit=crop&w=400&q=80" },
          { name: "Elaboración", url: "https://images.unsplash.com/photo-1606312619070-d48b4c652a52?auto=format&fit=crop&w=400&q=80" }
        ]
      },
      vision: {
        badge: "PROYECCIÓN E IMPACTO",
        title: "🚀 Visión (Año 2030)",
        text: "Para el año 2030, Chocolegum Natural busca convertirse en una marca reconocida en Tocancipá y sus alrededores por ofrecer chocolates artesanales y snacks innovadores elaborados con ingredientes naturales como garbanzo y lentejas, destacándonos por innovación y compromiso.",
        gallery: [
          { name: "Tocancipá & Región", url: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=400&q=80" },
          { name: "Expansión 2030", url: "https://images.unsplash.com/photo-1526947425960-945c6e72858f?auto=format&fit=crop&w=400&q=80" },
          { name: "Bienestar", url: "https://images.unsplash.com/photo-1511381939415-e44015466834?auto=format&fit=crop&w=400&q=80" }
        ]
      },
      ingredientes: {
        badge: "SELECCIÓN NATURAL & GOURMET",
        title: "🌱 ¿Qué hay en nuestros productos?",
        text: "Ingredientes seleccionados: Chocolate artesanal, frutas seleccionadas, crema de pistacho, pasta kataifi, frutos secos y la potencia nutricional de la harina de garbanzo y lentejas.",
        gallery: [
          { name: "Crema de Pistacho", url: "https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=400&q=80" },
          { name: "Kataifi & Frutos", url: "https://images.unsplash.com/photo-1508737027454-e6454ef46afd?auto=format&fit=crop&w=400&q=80" },
          { name: "Harinas Legumbres", url: "https://images.unsplash.com/photo-1515543237350-b3eea1ec8082?auto=format&fit=crop&w=400&q=80" }
        ]
      },
      sena: {
        badge: "INNOVACIÓN ACADÉMICA",
        title: "🤝 Relación con el SENA",
        text: "Aplicamos conocimientos estratégicos de emprendimiento, ciencia de alimentos, administración y comercialización impartidos por el SENA, fortaleciendo nuestras habilidades para consolidar una unidad de negocio sólida y sostenible.",
        gallery: [
          { name: "Emprendimiento", url: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=400&q=80" },
          { name: "Innovación Alimentos", url: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=400&q=80" },
          { name: "Comercialización", url: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=400&q=80" }
        ]
      }
    };

    function showSection(key) {
      const data = contentData[key];
      if (!data) return;

      document.getElementById('card-badge').innerText = data.badge;
      document.getElementById('card-title').innerText = data.title;
      document.getElementById('card-text').innerText = data.text;

      let galleryHTML = '<div class="image-gallery">';
      data.gallery.forEach(item => {
        galleryHTML += `
          <div class="image-card">
            <img src="${item.url}" alt="${item.name}">
            <span>${item.name}</span>
          </div>
        `;
      });
      galleryHTML += '</div>';

      document.getElementById('gallery-container').innerHTML = galleryHTML;

      // Animación suave de actualización de tarjeta
      const card = document.getElementById('info-card');
      card.style.transform = 'translateX(-50%) translateY(-6px)';
      setTimeout(() => {
        card.style.transform = 'translateX(-50%) translateY(0)';
      }, 200);
    }
  </script>
</body>
</html>
